[pytest]
# pytest-qt loads Qt before the app does, which makes QtWebEngineCore fail
# with "DLL load failed" on Windows. The tests do not use it.
addopts = -p no:pytest-qt
# Unit tests only. tests/e2e and tests/sanity drive real audio, screens and
# services by hand.
testpaths = tests
norecursedirs = e2e sanity .* __pycache__
