sonar.projectKey=SnapSolve
sonar.projectName=SnapSolve
sonar.host.url=http://localhost:9000
# Authentication comes from the SONAR_TOKEN environment variable.
# Never put a token in this file: it is committed.

sonar.sources=.
sonar.exclusions=services/whisperlive/**,**/.venv/**,**/build/**,**/.gradle/**,**/.kotlin/**,**/.idea/**,**/gradle/wrapper/**,core/web_assets/shiki.bundle.js,sessions/**,cache/**,logs/**
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8

# Accepted: the Android remote control talks to the desktop app's API over
# plain HTTP on the local network, so it must allow clear-text traffic.
sonar.issue.ignore.multicriteria=cleartext
sonar.issue.ignore.multicriteria.cleartext.ruleKey=xml:S5332
sonar.issue.ignore.multicriteria.cleartext.resourceKey=android_remote_control/app/src/main/AndroidManifest.xml
