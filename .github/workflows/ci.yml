# Lint and unit tests on every push and pull request.
# Windows, because the app (keyboard hooks, pyautogui, PyAudio) is Windows-first.
# The GPU stack is left out (scripts/ci_requirements.py); scripts/check_gpu.py
# and scripts/verify.ps1 (Qodana, SonarQube) still run locally.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies (locked, without the GPU stack)
        run: |
          python scripts/ci_requirements.py > ci-requirements.txt
          python -m pip install --upgrade pip
          python -m pip install -r ci-requirements.txt pytest==9.0.3 ruff==0.17.4

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        run: python -m pytest -q
