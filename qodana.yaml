#################################################################################
#              WARNING: Do not store sensitive information in this file,        #
#               as its contents will be included in the Qodana report.          #
#################################################################################
version: "1.0"
linter: qodana-python-community
image: jetbrains/qodana-python-community:2026.2

# Builds the interpreter Qodana analyses against. Scans must pass
#   -e QODANA_PYTHON_PATH=/data/cache/snapsolve-venv/bin/python
# (scripts/verify.ps1 and scripts/verify.sh do).
bootstrap: bash scripts/qodana_bootstrap.sh

exclude:
    -   name: All
        paths:
            - services/whisperlive
            - services/diarization/.venv
            - android_remote_control
            - core/web_assets/shiki.bundle.js
    # Ruff enforces PEP 8. PyCharm's own PEP 8 check shells out to pycodestyle,
    # and in the container that child can turn zombie and hang the scan forever.
    -   name: PyPep8Inspection
    # Same policy as ruff.toml (BLE not selected): a blind `except Exception`
    # is deliberate in worker threads, Qt callbacks and best-effort probes,
    # which must not die. Handlers with an obvious narrow type use it.
    -   name: PyBroadExceptionInspection
    # Checks the analysis venv against requirements.txt, not the code. That venv
    # leaves PyAudio out on purpose (it needs PortAudio headers to build), and in
    # 2026.2 the check stalls every inspection thread for ~5 minutes per scan.
    -   name: PyPackageRequirementsInspection
include:
    -   name: DuplicatedCode
    -   name: PyUnresolvedReferences
    -   name: PyTypeChecker
