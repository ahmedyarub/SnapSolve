#################################################################################
#              WARNING: Do not store sensitive information in this file,        #
#               as its contents will be included in the Qodana report.          #
#################################################################################
version: "1.0"
linter: qodana-python-community
image: jetbrains/qodana-python-community:2026.1

# Builds the interpreter Qodana analyses against. Scans must pass
#   -e QODANA_PYTHON_PATH=/data/cache/snapsolve-venv/bin/python
# (scripts/verify.ps1 and scripts/verify.sh do).
bootstrap: bash scripts/qodana_bootstrap.sh

exclude:
    -   name: All
        paths:
            - services/whisperlive
            - services/diarization/.venv
            - android_remote_control
            - core/web_assets/shiki.bundle.js
include:
    -   name: DuplicatedCode
    -   name: PyUnresolvedReferences
    -   name: PyTypeChecker
